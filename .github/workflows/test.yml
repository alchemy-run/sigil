name: Test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Node.js ${{ matrix.node_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node_version:
          - 26
          - 24
          - 22
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout Yoga reference
        run: git submodule update --init --depth=1 --checkout -- .vendor/yoga

      - name: Setup Vite+ and Node.js
        uses: voidzero-dev/setup-vp@e4759006b2f2888ed11658d4609d4d2fc859f271 # v1.21.0
        with:
          version: "0.3.2"
          node-version: ${{ matrix.node_version }}
          run-install: true

      - name: Build
        run: vpr build

      - name: Build Yoga reference
        run: vpr build:reference

      - name: Setup Bun for JSX runtime regression tests
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.13"

      - name: Test
        run: vpr test --run
        env:
          FORCE_COLOR: true
          # Sigil treats every non-empty CI value, including "false", as CI.
          CI: ""
